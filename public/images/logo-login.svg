<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>
    <filter id="loginGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0b1329" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  <circle cx="128" cy="128" r="90" fill="url(#glowGrad)" />
  
  <!-- LoRa Waves -->
  <path d="M 84 128 A 44 44 0 0 1 172 128" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 58 128 A 70 70 0 0 1 198 128" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 36 128 A 92 92 0 0 1 220 128" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
  
  <!-- Central Tower / Node -->
  <circle cx="128" cy="128" r="24" fill="url(#loginGrad)" filter="url(#loginGlow)" />
  <circle cx="128" cy="128" r="10" fill="#ffffff" />
  <path d="M 108 152 L 128 208 L 148 152 Z" fill="#38bdf8" />
</svg>
