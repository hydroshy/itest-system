  <!-- Vue 3 with multiple CDN failover mirrors -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.prod.min.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>');
    }
  </script>

  <!-- THEME PRE-INIT -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('dvt_theme');
        var theme = (saved === 'dark') ? 'dark' : 'light';
        document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
      } catch(e) {
        document.documentElement.classList.add('theme-light');
      }
    })();
  </script>
  <style>
<!-- @slot:css -->
  </style>
</head>

    <div v-if="sessionExpired" class="bg-amber-950 border-b border-amber-500 px-4 py-3 text-amber-100 text-sm flex items-center justify-between gap-3 shrink-0">
      <span>Phiên đăng nhập đã hết hạn hoặc tài khoản không khả dụng. Vui lòng đăng nhập lại.</span>

    </div>

<!-- @slot:header -->

<!-- @slot:sidebar -->
