version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itest_core_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-itest-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-itest_system_user}
      - DB_PASSWORD=${DB_PASSWORD:-system_secret_2026}
      - DB_NAME=${DB_NAME:-itest_platform}
      - DB_SYNCHRONIZE=false
      - JWT_SECRET=${JWT_SECRET:-Production_Super_Secret_Key_Change_Me_2026!}
      - DB_ROUTING_CONFIG_PATH=/app/config/db-routing.config.json
      - OPS_AGENT_URL=${OPS_AGENT_URL:-http://itest_ops_agent:3099}
      - PAYLOAD_LIMIT=${PAYLOAD_LIMIT:-50mb}
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
    extra_hosts:
      - "mas.local:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/plugins || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - itest-network

networks:
  itest-network:
    name: itest-network
    external: true
