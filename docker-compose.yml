version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_lorawan_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_SYNCHRONIZE=true
      - JWT_SECRET=Production_Super_Secret_Key_Change_Me_2025!
      - DB_ROUTING_CONFIG_PATH=/app/config/db-routing.config.json
      - OPS_AGENT_URL=http://ops_agent:3099
    volumes:
      - ./config:/app/config
    depends_on:
      - postgres_db
    extra_hosts:
      - "mas.local:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - lorawan_net

  ops_agent:
    build:
      context: .
      dockerfile: Dockerfile.ops-agent
    container_name: daviteq_ops_agent
    restart: always
    ports:
      - "3099:3099"
    environment:
      - PORT=3099
      - TARGET_CONTAINER_NAME=nest_lorawan_app
      - REPO_DIR=/app/repo
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USERNAME=admin
      - DB_PASSWORD=mason
      - DB_DATABASE=dvt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/repo:ro
    networks:
      - lorawan_net

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mason
      POSTGRES_DB: dvt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lorawan_net

networks:
  lorawan_net:
    driver: bridge

volumes:
  postgres_data:
