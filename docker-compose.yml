version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_lorawan_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=Production_Super_Secret_Key_Change_Me_2025!
      - DB_ROUTING_CONFIG_PATH=/app/config/db-routing.config.json
    volumes:
      - ./config:/app/config
    depends_on:
      - postgres_db
    networks:
      - lorawan_net

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mason
      POSTGRES_DB: dvt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lorawan_net

networks:
  lorawan_net:
    driver: bridge

volumes:
  postgres_data:
