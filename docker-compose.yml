version: '3.8'

services:
  postgres_db:
    image: postgres:17-alpine
    container_name: itest_core_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-itest_system_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itest_system_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-itest_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itest_system_user} -d ${DB_NAME:-itest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itest_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itest_core_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-itest_system_user}
      - DB_PASSWORD=${DB_PASSWORD:-itest_system_secure_pass_2026}
      - DB_NAME=${DB_NAME:-itest_db}
      - DB_SYNCHRONIZE=false
      - JWT_SECRET=${JWT_SECRET:-Production_Super_Secret_Key_Change_Me_2026!}
      - DB_ROUTING_CONFIG_PATH=/app/config/db-routing.config.json
      - OPS_AGENT_URL=${OPS_AGENT_URL:-http://ops_agent:3099}
      - PAYLOAD_LIMIT=${PAYLOAD_LIMIT:-50mb}
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
    depends_on:
      postgres_db:
        condition: service_healthy
    extra_hosts:
      - "mas.local:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/plugins || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - itest_net

volumes:
  postgres_data:
    driver: local

networks:
  itest_net:
    name: itest_net
    driver: bridge
